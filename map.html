<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>DFW NMSF Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <!-- Leaflet.markercluster CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .map-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 10px;
            border-radius: 4px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
            max-width: 260px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }

        .map-controls h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
        }

        .map-controls strong {
            font-size: 13px;
        }

        .map-controls label {
            white-space: nowrap;
        }

        .map-controls input[type="range"] {
            width: 100%;
        }

        .school-marker {
            border-radius: 50%;
            border: 2px solid #333;
            width: 18px;
            height: 18px;
            background-clip: padding-box;
        }

        .school-marker.sector-public {
            background-color: #1f77b4;
        }

        .school-marker.sector-private {
            background-color: #ff7f0e;
        }

        .school-marker.sector-charter {
            background-color: #2ca02c;
        }

        .legend-control {
            background: rgba(255, 255, 255, 0.95);
            padding: 6px 8px;
            border-radius: 4px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
        }

        .legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
            border: 1px solid #333;
        }

        .legend-swatch.public {
            background-color: #1f77b4;
        }

        .legend-swatch.private {
            background-color: #ff7f0e;
        }

        .legend-swatch.charter {
            background-color: #2ca02c;
        }

        .popup-chart-wrapper {
            margin-top: 6px;
            width: 260px;
            height: 160px;
        }

        .popup-chart-wrapper canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <div id="controls" class="map-controls">
        <h3>Filters</h3>

        <div>
            <strong>Years</strong>
            <div id="yearFilters"></div>
        </div>

        <div style="margin-top:8px;">
            <strong>School type</strong>
            <div id="sectorFilters">
                <label><input type="checkbox" class="sector-filter" value="public" checked> Public</label><br />
                <label><input type="checkbox" class="sector-filter" value="private" checked> Private</label><br />
                <label><input type="checkbox" class="sector-filter" value="public charter" checked> Charter</label>
            </div>
        </div>

        <div style="margin-top:8px;">
            <strong>Minimum total (selected years)</strong>
            <div>
                <input type="range" id="minTotal" min="0" max="80" value="0" />
                <span id="minTotalLabel">0</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-o9N1j7kP1CecqG8zCibwxgI7ZkGsR3bCi2A+0p3p3pU="
        crossorigin=""
    ></script>

    <!-- Leaflet.markercluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>

    <!-- Your application script -->
    <script src="script.js"></script>
</body>
</html>
