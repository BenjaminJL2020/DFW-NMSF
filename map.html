<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>DFW NMSF Map</title>

    <!-- Leaflet CSS (no integrity / crossorigin) -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <!-- Leaflet.markercluster CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
    />
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
    />

    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        #map {
            height: 100%;
            width: 100%;
        }

        .map-controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 10px;
            border-radius: 4px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 13px;
            max-width: 260px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }

        .map-controls h3 {
            margin: 0 0 6px 0;
            font-size: 14px;
        }

        .map-controls strong {
            font-size: 13px;
        }

        .map-controls label {
            white-space: nowrap;
        }

        .map-controls input[type="range"] {
            width: 100%;
        }

        .school-marker {
            border-radius: 50%;
            border: 2px solid #333;
            width: 18px;
            height: 18px;
            background-clip: padding-box;
        }

        .school-marker.sector-public {
            background-color: #1f77b4;
        }

        .school-marker.sector-private {
            background-color: #ff7f0e;
        }

        .school-marker.sector-charter {
            background-color: #2ca02c;
        }

        .legend-control {
            background: rgba(255, 255, 255, 0.95);
            padding: 6px 8px;
            border-radius: 4px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 12px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
        }

        .legend-swatch {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 6px;
            border: 1px solid #333;
        }

        .legend-swatch.public {
            background-color: #1f77b4;
        }

        .legend-swatch.private {
            background-color: #ff7f0e;
        }

        .legend-swatch.charter {
            background-color: #2ca02c;
        }

        .nmsf-marker {
            width: 1px;
            height: 1px;
            background: transparent;
            position: relative;
        }
        .nmsf-wrapper {
            position: absolute;
            bottom: 0;
            left: 0;
            transform: translate(-50%, 0);
            display: flex;
            flex-direction: row;
            align-items: flex-end;
            gap: 8px;
            cursor: pointer;
        }
        .nmsf-chart {
            display: flex;
            gap: 2px;
            align-items: flex-end;
            position: relative;
            background: rgba(240, 240, 240, 0.4);
            padding: 5px;
            border-radius: 2px;
            transition: background-color 0.2s;
            cursor: pointer;
        }
        .nmsf-chart.selected {
            background: rgba(255, 200, 0, 0.6);
        }
        .nmsf-bar-wrap[data-year="2025"] .nmsf-bar.highlighted {
            outline: 3px solid rgba(255, 0, 0, 0.8);
            outline-offset: 2px;
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.6);
        }
        .nmsf-bar-wrap {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .nmsf-bar {
            background: rgba(31, 120, 180, 0.7);
            border-radius: 3px 3px 0 0;
            min-height: 4px;
            cursor: pointer;
            min-width: 8px;
        }
        .nmsf-bar.sector-public {
            background: rgba(31, 120, 180, 0.7);
        }
        .nmsf-bar.sector-private {
            background: rgba(255, 127, 14, 0.7);
        }
        .nmsf-bar.sector-charter {
            background: rgba(44, 160, 44, 0.7);
        }
        .nmsf-bar.hidden {
            display: none;
        }
        .nmsf-top-label {
            position: absolute;
            bottom: 100%;
            transform: translateY(-8px);
            background: rgba(255,255,255,0.95);
            border: 1px solid #aaa;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            display: none;
            z-index: 1000;
            pointer-events: none;
        }
        .nmsf-bottom-label {
            position: absolute;
            top: 100%;
            transform: translateY(8px);
            background: rgba(255,255,255,0.95);
            border: 1px solid #aaa;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            display: none;
            z-index: 1000;
            pointer-events: none;
        }
        .nmsf-bar-wrap:hover .nmsf-top-label,
        .nmsf-bar-wrap:hover .nmsf-bottom-label {
            display: block;
        }
        .nmsf-label {
            font-size: 13px;
            font-weight: 700;
            color: #0b3d91;
            text-shadow: 0 1px 3px #fff;
            white-space: normal;
            word-wrap: break-word;
            text-align: left;
            line-height: 1.2;
            font-family: "Arial Narrow", Arial, sans-serif;
            max-width: 150px;
            display: flex;
            align-items: flex-end;
        }

        .nmsf-label.hover-only {
            position: absolute;
            left: 100%;
            margin-left: 8px;
            bottom: 0;
            display: none !important;
            pointer-events: none;
            z-index: 1000;
            white-space: normal;
        }

        .nmsf-wrapper:hover .nmsf-label.hover-only {
            display: flex !important;
        }

        #zoom-level {
            position: absolute;
            top: 80px;
            left: 10px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid #aaa;
            border-radius: 4px;
            padding: 4px 8px;
            font: 12px sans-serif;
            z-index: 1000;
        }

        #map-title {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid #aaa;
            border-radius: 4px;
            padding: 8px 12px;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            font-size: 14px;
            z-index: 1000;
            text-align: center;
            box-shadow: 0 1px 4px rgba(0,0,0,0.25);
        }

        #map-title h1 {
            margin: 0 0 4px 0;
            font-size: 16px;
            font-weight: 600;
        }

        #map-title .subtitle {
            font-size: 12px;
            color: #666;
        }

        #map-title a {
            color: #0066cc;
            text-decoration: none;
        }

        #map-title a:hover {
            text-decoration: underline;
        }

        .county-tooltip {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #333;
            border-radius: 4px;
            padding: 4px 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <div id="map-title">
        <h1>Dallas-Fort Worth Area National Merit Semifinalists</h1>
        <div class="subtitle">
            <a href="about.html">What is this?</a> | 
            Credit: <a href="https://github.com/BenjaminJL2020" target="_blank">Github/BenjaminJL2020</a>
        </div>
    </div>
    <div id="zoom-level">Zoom: …</div>

    <div id="controls" class="map-controls">
        <h3>Filters</h3>

        <div>
            <strong>Years</strong>
            <div id="yearFilters"></div>
        </div>

        <div style="margin-top:8px;">
            <strong>School type</strong>
            <div id="sectorFilters">
                <label><input type="checkbox" class="sector-filter" value="public" checked> Public</label><br />
                <label><input type="checkbox" class="sector-filter" value="private" checked> Private</label><br />
                <label><input type="checkbox" class="sector-filter" value="public charter" checked> Charter</label>
            </div>
        </div>

        <div style="margin-top:8px;">
            <strong>Minimum total (selected years)</strong>
            <div>
                <input type="range" id="minTotal" min="0" max="80" value="0" />
                <span id="minTotalLabel">0</span>
            </div>
        </div>
    </div>

    <!-- Leaflet JS (no integrity / crossorigin) -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Leaflet.markercluster JS -->
    <script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>

    <!-- Your application script -->
    <script src="script.js"></script>
</body>
</html>
